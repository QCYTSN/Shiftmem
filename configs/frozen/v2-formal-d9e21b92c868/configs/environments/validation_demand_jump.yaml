name: validation_demand_jump
episode_length: 150
initial_inventory: 55
demand_model: negative_binomial
demand: {base_level: 18, dispersion: 12}
supply: {lead_time: 2, fill_rate: 1.0}
costs: {purchase: 1.0, holding: 0.2, stockout: 5.0, fixed_order: 0.0}
shifts:
  - type: sudden_demand
    start_day: 70
    changes: {base_level_multiplier: 1.4}
