name: periodic_combined
episode_length: 150
initial_inventory: 60
demand_model: negative_binomial
demand:
  base_level: 20
  dispersion: 10
supply:
  lead_time: 2
  fill_rate: 1.0
costs:
  purchase: 1.0
  holding: 0.2
  stockout: 5.0
  fixed_order: 0.0
shifts:
  - type: periodic_demand
    start_day: 0
    changes:
      amplitude: 0.25
      period: 30
  - type: sudden_supply
    start_day: 75
    changes:
      lead_time: 4
      fill_rate: 0.9
