# Budget-approved live v2 Pilot (Validation only).
#
# User-approved 2026-07-14: max 350 provider calls and CNY 6 total.
# Measures real token cost per strategy review and requalifies the two core
# models on the strategy schema. Never references Test-ID/Test-OOD.
#
# Cost anchor from the v1.1 live run: CNY 0.00894/call (CNY 3.2184 / 360 calls).
# Planned reviews: 1 scenario x 2 seeds x 2 models x 2 methods x ~31 reviews
# = ~248 review calls; well under the 350 cap.
protocol: v2
split: Validation
provider: siliconflow

memory_methods: [vector, shiftmem]
models:
  - {label: deepseek, model_name: deepseek-ai/DeepSeek-V3.2}
  - {label: minimax, model_name: MiniMaxAI/MiniMax-M2.5}
seeds: [1000, 1001]

max_days: 150
review_interval: 5
cooldown: 3

budget_approved: true
budgets:
  max_calls: 350
  max_cost_cny: 6
  cny_per_call: 0.00894
