  - config_id: confidence-heavy
    weights: {semantic: 0.75, confidence: 1.0, recency: 0.25, utility: 0.5, probation_penalty: 0.5, changed_variable_penalty: 0.75}
  - config_id: recency-heavy
    weights: {semantic: 0.75, confidence: 0.5, recency: 1.0, utility: 0.25, probation_penalty: 0.25, changed_variable_penalty: 0.5}
model:
