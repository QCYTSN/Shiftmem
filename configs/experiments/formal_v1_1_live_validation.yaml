seeds_per_cell: 5
live_seeds: [1000]
post_shift_days: 30
budget_approved: true
budget_approval_date: 2026-07-14
budget_scope: Development/Validation live dry-run only
scenario: configs/environments/validation_demand_jump.yaml
budgets:
  max_calls: 360
  max_input_tokens: 1500000
  max_output_tokens: 500000
  max_cost_cny: 30.0
models:
  - {label: deepseek_v3_2, profile: siliconflow, model_id: deepseek-ai/DeepSeek-V3.2, input_cny_per_million: 4.0, output_cny_per_million: 6.0}
  - {label: minimax_m2_5, profile: siliconflow, model_id: MiniMaxAI/MiniMax-M2.5, input_cny_per_million: 2.1, output_cny_per_million: 8.4}
methods:
  - {config_id: none}
  - {config_id: full_history}
  - {config_id: summary}
  - {config_id: vector}
  - {config_id: time_decay}
  - config_id: shiftmem
    dormancy_patience: 3
    detector_min_samples: 10
    detector_delta: 0.1
    detector_threshold: 48.0
    weights: {semantic: 0.75, confidence: 0.5, recency: 1.0, utility: 0.25, probation_penalty: 0.25, changed_variable_penalty: 0.5}
