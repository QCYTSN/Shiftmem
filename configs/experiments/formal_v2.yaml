# Protocol v2 formal experiment matrix (hierarchical strategy-review design).
#
# The primary confirmatory tier compares VectorMemory vs ShiftMem across the
# eight held-out scenarios, ten paired seeds, and two core models = 320 cells.
# The secondary tier runs the four remaining baselines on DeepSeek only with
# five seeds and the same eight scenarios = 160 cells.
#
# This config authorizes Development/Validation dry-runs only. Live execution
# remains blocked until a completed v2 Pilot, an explicitly approved budget,
# and a verified clean v2 freeze. Test-ID/Test-OOD scenarios are rejected by
# the cell-plan builder.
protocol: v2

models:
  - {label: deepseek, provider: siliconflow, model_name: deepseek-ai/DeepSeek-V3.2}
  - {label: minimax, provider: siliconflow, model_name: MiniMaxAI/MiniMax-M2.5}

primary_methods:
  - {config_id: vector}
  - {config_id: shiftmem}

secondary_methods:
  - {config_id: none}
  - {config_id: full_history}
  - {config_id: summary}
  - {config_id: time_decay}

secondary_model: deepseek

primary_seeds: 10
secondary_seeds: 5
post_shift_days: 30

# Review schedule and strategy bounds are Validation-selected and become frozen
# fields; the values below are provisional Development placeholders.
review_interval: 5
cooldown: 3
controller_profile:
  defaults: {forecast_window: 14, safety_stock_multiplier: 1.2, lead_time_buffer: 1}
  bounds:
    forecast_window: [1, 60]
    safety_stock_multiplier: [0.0, 5.0]
    lead_time_buffer: [0, 14]
shiftmem_profile:
  memory:
    detector_min_samples: 10
    detector_delta: 0.1
    detector_threshold: 48.0
    validation_service_window: 3
    dormancy_patience: 3
  retrieval:
    semantic: 0.75
    confidence: 0.5
    recency: 1.0
    utility: 0.25
    probation_penalty: 0.25
    changed_variable_penalty: 0.5
    recency_half_life: 30.0

# The completed v2 Pilot supports the provisional planning envelope below.
# It is not approved: explicit user approval and a verified v2 freeze remain
# mandatory before any Test-ID/Test-OOD execution.
budget_approved: false
budgets:
  max_calls: 20000
  max_input_tokens: 90000000
  max_output_tokens: 7000000
  max_cost_cny: 360
