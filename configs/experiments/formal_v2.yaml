      run_identity: {run_id: v2-formal-cont-20260719-50aaafda0d6a, freeze_id: v2-formal-50aaafda0d6a, git_commit: 2cf2b5afd9268a2e0cc89ac8f4be9e488314d2bf, config_hash: e623fa1e0d84a6d4bcf098145b1af69a0be692a876866d5ddc27cddf02b7ff66}
