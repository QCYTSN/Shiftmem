budgets:
  max_calls: 7000
  # These reservation-ledger ceilings preserve failed-call uncertainty; they
  # are not spending authorization.
  max_input_tokens: 90000000
  max_output_tokens: 12000000
  max_cost_cny: 250
  # Preflight stops before the next successful response can exceed this cap.
  max_successful_cost_cny: 50
